version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: revix-db
    environment:
      POSTGRES_DB: revix
      POSTGRES_USER: revix
      POSTGRES_PASSWORD: revix
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
   driver: local