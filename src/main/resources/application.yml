spring:
  application:
    name: Revix

  datasource:
    url: jdbc:postgresql://localhost:5432/revix
    username: ${DB_USER:revix}
    password: ${DB_PASSWORD:revix}

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  logging:
    level:
      org.flywaydb: DEBUG
      org.springframework.boot.autoconfigure.flyway: DEBUG

